{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finalizar Pedido - BomGás</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header class="cabecalho">
        <div class="logo">
            <img src="{% static 'images/image.png' %}" width="200" height="70" alt="Logo">
        </div>

        <nav>
            <a href="{% url 'inicio' %}">
                <i class="fa-solid fa-house"></i>
                Início
            </a>

            <a href="{% url 'produtos' %}">
                <i class="fa-solid fa-fire-flame-simple"></i>
                Produtos
            </a>

            <a href="{% url 'carrinho' %}" class="carrinho">
                <i class="fa-solid fa-cart-shopping"></i>
                Meu Pedido
                <span id="contador-carrinho">0</span>
            </a>

            <a href="{% url 'meus_pedidos' %}">
                <i class="fa-solid fa-clipboard-list"></i>
                Meus Pedidos
            </a>

            {% if cliente_sessao %}
            <a href="{% url 'sair' %}" class="usuario-sessao">
                <i class="fa-solid fa-user"></i>
                Olá, {{ cliente_sessao.primeiro_nome }} (Sair)
            </a>
            {% else %}
            <a href="{% url 'entrar' %}">
                <i class="fa-solid fa-user"></i>
                Entrar
            </a>
            {% endif %}
        </nav>
    </header>


    <main>

        <section class="finalizar-pedido">

            <h1>Finalizar Pedido</h1>

            <p>Preencha seus dados para receber o pedido.</p>


            <form id="form-finalizar-pedido" onsubmit="event.preventDefault(); confirmarPedido();">

                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input type="text" id="nome" name="cliente" placeholder="Digite seu nome"
                        value="{{ cliente_sessao.nome|default:'' }}" required>

                </div>


                <div class="campo">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000"
                        value="{{ cliente_sessao.telefone|default:'' }}" required>

                </div>


                <div class="campo">

                    <label for="endereco">
                        Endereço
                    </label>

                    <input type="text" id="endereco" name="endereco" placeholder="Rua, Avenida..."
                        value="{{ cliente_sessao.endereco|default:'' }}" required>

                </div>


                <div class="campos-linha">

                    <div class="campo">

                        <label for="numero">
                            Número
                        </label>

                        <input type="text" id="numero" name="numero_endereco" placeholder="Número"
                            value="{{ cliente_sessao.numero_endereco|default:'' }}" required>

                    </div>


                    <div class="campo">

                        <label for="bairro">
                            Bairro
                        </label>

                        <input type="text" id="bairro" name="bairro" placeholder="Bairro"
                            value="{{ cliente_sessao.bairro|default:'' }}" required>

                    </div>

                </div>


                <div class="campo">

                    <label for="observacao">
                        Observação
                    </label>

                    <textarea id="observacao" name="observacao" placeholder="Alguma informação para a entrega?"
                        rows="4"></textarea>

                </div>


                <button type="submit" class="btn-finalizar">
                    Confirmar pedido
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 BomGás - Gás, água e carvão na sua porta.</p>
    </footer>

    <script src="{% static 'js/script.js' %}"></script>

</body>

</html>
